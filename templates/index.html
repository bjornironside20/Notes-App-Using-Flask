<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <a href="/add" class="add-btn">Add Note</a>
      <h2>Your Notes:</h2>

      <div class="notes-container">
        {% for note in notes %}
        <div class="note-card">
          <h3>{{ note.title }}</h3>
          <p>{{ note.content }}</p>

          <!-- Delete Form -->
          <div class="actions">
            <form action="/delete/{{ note.id }}" method="post">
              <button type="submit" class="delete-btn">Delete Note</button>
            </form>

            <a href="/edit/{{ note.id }}" class="edit-btn">Edit</a>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
